# release-plz configuration — https://release-plz.dev/docs/config
#
# The crate uses Conventional Commits (`feat:`/`fix:`/`chore:`/`ci:`/
# `docs:`/`refactor:`/`test:`, with `!` for breaking changes). The commit type
# drives the version bump; the changelog is rendered by git-cliff from
# `cliff.toml`, which owns the grouping and the issue cross-reference.
#
# The project prefixes every commit with the issue number
# (`#<issue> <type>: <description>`, see `CONTRIBUTING.md`). Such a message is
# not a Conventional Commit, so release-plz would read it as a plain patch
# bump. The regexes below restore the intended semantics: the type is matched
# against the whole message, and a breaking change still yields a minor bump
# for the `0.x` line.

[workspace]
# Only the three published crates are managed; examples (publish = false)
# and any future workspace members are ignored unless opted in explicitly.
release = false
# The changelog belongs to git-cliff: it lists every change of the repository
# since the previous release, not only the commits that touched the published
# crate. The release workflow renders it into the release pull request.
changelog_update = false
# The semver check is disabled here: release-plz runs the cargo-semver-checks
# version bundled into its own binary, and that version cannot parse the
# rustdoc JSON of the current stable toolchain (rustdoc format v61, the
# failure of 2026-10-20). The check itself stays in the repository CI as the
# `Semver checks` job of `ci.yml`, which always uses the fresh upstream
# cargo-semver-checks. Re-enable this option once the bundled version supports
# the current stable rustdoc format.
semver_check = false
# The issue prefix hides the commit type from the Conventional Commit parser,
# so the type is matched explicitly against the whole message. A breaking
# change (`feat!:`) bumps the minor version on the `0.x` line, exactly like the
# upstream Conventional Commit rules. The regexes must be revisited when the
# crate reaches `1.0`, where a breaking change has to bump the major version.
custom_minor_increment_regex = '^#\d+ feat!'
# A release is prepared only when a commit changes the published crates. Every
# change of the project is committed with the issue prefix, and the dependency
# updates of dependabot are committed without it. The service commits of the
# release flow update the changelog and the readme of the repository, and they
# are not a reason to publish a new version.
release_commits = '^(#\d+ )?(feat|fix|perf|refactor|docs|test|breaking|build|style|chore\(deps\))'
pr_draft = false
pr_labels = ["release"]

[[package]]
name = "masterror-template"
release = true

[[package]]
name = "masterror-derive"
release = true

[[package]]
name = "masterror"
release = true
