name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish all crates (ignores the crates.io version check)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  CRATES: "masterror-template masterror-derive masterror"

jobs:
  create-release-pr:
    name: Create release PR
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Sync the release pull request with main
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          pr_branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))][0].headRefName // empty')
          if [ -z "$pr_branch" ]; then
            echo "no release pull request to sync"
            exit 0
          fi
          git fetch origin main "$pr_branch"
          git checkout -q -B "$pr_branch" "origin/$pr_branch"
          git rebase origin/main
          git push --force origin "HEAD:refs/heads/$pr_branch"
          echo "$pr_branch is aligned with main"

      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
          version: 0.3.172
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Add the release section to the changelog
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))][0] // empty')
          if [ -z "$pr" ]; then
            echo "no release pull request to update"
            exit 0
          fi
          pr_number=$(printf '%s' "$pr" | jq -r '.number')
          pr_branch=$(printf '%s' "$pr" | jq -r '.headRefName')

          git fetch origin "$pr_branch"
          git checkout -q -B "$pr_branch" "origin/$pr_branch"

          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if git rev-parse "v$version" >/dev/null 2>&1; then
            git cliff --config cliff.toml -o CHANGELOG.md
          else
            git cliff --config cliff.toml --tag "v$version" -o CHANGELOG.md
          fi

          if git diff --quiet CHANGELOG.md; then
            echo "the release changelog is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore: add the $version release section to the changelog"
          git push origin "HEAD:$pr_branch"

          published=$(curl -sSf -A "masterror-ci/2.0" \
            "https://crates.io/api/v1/crates/masterror" | jq -r '.crate.max_version')
          section=$(awk '/^## \[/{f=1} f' CHANGELOG.md)
          gh pr edit "$pr_number" --body "$(printf '## 🤖 New release\n\n* `masterror`: %s -> %s\n\n%s\n\n---\nThis PR was generated with [release-plz](https://github.com/release-plz/release-plz/).\n' "$published" "$version" "$section")"

  check-versions:
    name: Check versions on crates.io
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check versions on crates.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/versions.md"
          status=0
          .github/scripts/check_release_pr.sh "$BASE_SHA" > "$report" || status=$?

          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          {
            echo "<!-- release-versions -->"
            echo ""
            echo "### Release version check"
            echo ""
            cat "$report"
          } > "${RUNNER_TEMP}/comment.md"

          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | startswith("<!-- release-versions -->"))] | last | .id // empty')
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$(cat "${RUNNER_TEMP}/comment.md")" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/comment.md"
          fi

          exit "$status"

  publish:
    name: Publish crates
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release-plz-'))
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
      tag: ${{ steps.publish.outputs.tag }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Publish crates
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force_publish }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/compare_versions.sh

          log() { echo "::group::$1"; }
          endlog() { echo "::endgroup::"; }
          info() { echo "ℹ️  $*"; }
          success() { echo "✅ $*"; }
          warn() { echo "::warning::$*"; }
          err() { echo "::error::$*"; }

          declare -A LOCAL REMOTE
          for crate in $CRATES; do
            LOCAL[$crate]=$(local_version "$crate")
            REMOTE[$crate]=$(published_version "$crate")
            info "$crate: local=${LOCAL[$crate]} published=${REMOTE[$crate]}"
          done

          MASTERROR_VERSION="${LOCAL[masterror]}"
          PUBLISHED_ANY=false

          if ! git rev-parse "v$MASTERROR_VERSION" >/dev/null 2>&1; then
            git cliff --config cliff.toml --tag "v$MASTERROR_VERSION" -o CHANGELOG.md
            if ! git diff --quiet CHANGELOG.md; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -qam "chore: update the changelog for v$MASTERROR_VERSION"
              git push origin HEAD:main || warn "the changelog commit is not pushed to main"
            fi
          fi

          for crate in $CRATES; do
            if [ "${LOCAL[$crate]}" = "${REMOTE[$crate]}" ] && [ "$FORCE" != "true" ]; then
              info "$crate: ${LOCAL[$crate]} is already published (skip)"
              continue
            fi
            if ! version_gt "${LOCAL[$crate]}" "${REMOTE[$crate]}" && [ "$FORCE" != "true" ]; then
              err "$crate: repository version ${LOCAL[$crate]} is older than the published ${REMOTE[$crate]}"
              exit 1
            fi

            log "Publishing $crate"
            published=false
            for attempt in 1 2 3 4 5; do
              info "Attempt $attempt/5"
              if cargo publish -p "$crate" --locked; then
                published=true
                break
              fi
              sleep $((attempt * 5))
            done
            endlog

            if [ "$published" != "true" ]; then
              err "Failed to publish $crate"
              exit 1
            fi
            success "$crate published!"
            PUBLISHED_ANY=true

            if [ "$crate" != "masterror" ]; then
              info "Waiting 20s for the crates.io index to sync..."
              sleep 20
            fi
          done

          TAG="v$MASTERROR_VERSION"
          RELEASED=false

          if [ "${LOCAL[masterror]}" = "${REMOTE[masterror]}" ] || [ "$PUBLISHED_ANY" = "true" ]; then
            RELEASED=true
            log "Creating GitHub release"

            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
              success "Created tag $TAG"
            fi

            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git cliff --config cliff.toml "$PREV_TAG"..HEAD --strip all 2>/dev/null || echo "Release $TAG")
            else
              NOTES=$(git cliff --config cliff.toml --strip all 2>/dev/null || echo "Release $TAG")
            fi

            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --title "$TAG" --notes "$NOTES" --latest
              success "Created GitHub release $TAG"
            fi

            endlog
          else
            warn "masterror $MASTERROR_VERSION is not on crates.io yet, no tag"
          fi

          {
            echo "published=$RELEASED"
            echo "version=$MASTERROR_VERSION"
            echo "sha=${{ github.event.pull_request.merge_commit_sha || github.sha }}"
            if [ "$RELEASED" = "true" ]; then
              echo "tag=$TAG"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 📦 Release Summary

          **Version:** `${{ steps.publish.outputs.version }}`
          **Tag:** `${{ steps.publish.outputs.tag }}`
          EOF

  artifacts:
    name: Security Artifacts
    needs: publish
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --all-features
          mv masterror.cdx.json sbom.json

      - name: Package crates
        run: cargo package --locked

      - name: Sign with Sigstore
        run: |
          cosign sign-blob --bundle sbom.cosign.bundle --yes sbom.json
          for f in target/package/*.crate; do
            [[ -f "$f" ]] && cosign sign-blob --bundle "${f}.cosign.bundle" --yes "$f"
          done

      - name: Generate attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            sbom.json
            target/package/*.crate

      - name: Upload to release
        if: needs.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.publish.outputs.tag }}" \
            sbom.json sbom.cosign.bundle \
            target/package/*.crate target/package/*.crate.cosign.bundle \
            --clobber || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            sbom.json
            sbom.cosign.bundle
            target/package/*.crate.cosign.bundle
          retention-days: 90
