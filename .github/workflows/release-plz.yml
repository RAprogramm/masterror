# Version bumps and release PRs only. Publishing to crates.io is handled by
# the "Release" job in ci.yml, which publishes all three crates in dependency
# order after a release PR with version bumps is merged.
name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' }}
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
          # The action's default (0.3.160) ran `cargo package` inside the
          # extracted registry copy and failed on published crates up to 0.31.0,
          # which embed `.cargo/config.toml` with path patches. Since 0.3.167
          # the extracted package's files are listed from disk, so the pin
          # avoids the failing `cargo package` call entirely.
          version: 0.3.172
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
      - name: Enable auto-merge on the release PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))][0].number // empty')
          if [ -n "$pr" ]; then
            gh pr merge --auto --squash "$pr" --repo "$GITHUB_REPOSITORY"
            echo "auto-merge enabled on release PR #$pr"
          else
            echo "no open release PR"
          fi
# trigger release-plz
